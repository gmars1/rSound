name: CI + Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: audio-controller-windows
            ext: .exe
          - name: Ubuntu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: audio-controller-linux
            ext: ""
          - name: Arch
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: audio-controller-arch
            ext: ""

    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.name == 'Arch' && 'archlinux:latest' || '' }}
    outputs:
      release_tag: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (Arch)
        if: matrix.name == 'Arch'
        run: |
          pacman -Syu --noconfirm rustup base-devel
          rustup default stable

      - name: Install Rust (others)
        if: matrix.name != 'Arch'
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        if: matrix.name != 'Arch'

      - run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/audio-controller${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: audio-controller-*
          path: ./release-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: ./release-files/*
          draft: false
          prerelease: false
